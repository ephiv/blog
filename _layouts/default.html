<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    {% assign site_root = site.github.url | default: site.baseurl | default: '' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site_root }}/assets/css/styles.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} feed" href="{{ site_root }}/feed.xml">
  </head>
  <body>
    <div class="site-shell markdown-page">
      {% include header.html %}
      <main class="page-content">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script src="{{ site_root }}/assets/js/scroll-progress.js"></script>
  </body>
</html>
