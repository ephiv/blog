{% assign giscus = site.giscus %}
{% if giscus.repo and giscus.repo_id != "" and giscus.category and giscus.category_id != "" %}
<section class="section-space giscus-shell" id="comments">
  <h2>comments</h2>
  <script
    src="https://giscus.app/client.js"
    data-repo="{{ giscus.repo }}"
    data-repo-id="{{ giscus.repo_id }}"
    data-category="{{ giscus.category }}"
    data-category-id="{{ giscus.category_id }}"
    data-mapping="{{ giscus.mapping | default: 'pathname' }}"
    data-strict="{{ giscus.strict | default: '0' }}"
    data-reactions-enabled="{{ giscus.reactions_enabled | default: '1' }}"
    data-emit-metadata="{{ giscus.emit_metadata | default: '0' }}"
    data-input-position="{{ giscus.input_position | default: 'bottom' }}"
    data-theme="{{ giscus.theme | default: 'light' }}"
    data-lang="{{ giscus.lang | default: site.lang | default: 'en' }}"
    data-loading="{{ giscus.loading | default: 'lazy' }}"
    crossorigin="anonymous"
    async>
  </script>
</section>
{% else %}
<section class="section-space giscus-shell giscus-shell-placeholder" id="comments">
  <h2>comments</h2>
  <p>Fill in <code>giscus.repo_id</code> and <code>giscus.category_id</code> in <code>_config.yml</code> after enabling GitHub Discussions and configuring <a href="https://giscus.app/">giscus</a>.</p>
</section>
{% endif %}
